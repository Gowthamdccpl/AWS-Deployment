# AWS: PV and PVC at the Shared level
# Azure: PV and PVC at the Factory level
{{ if and (eq .Values.cloudProvider "Azure") (not .Values.config.metadataPVC) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opcenter-metadata-pvc-{{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
{{ end }}
{{ if and (eq .Values.cloudProvider "AWS") (not .Values.config.metadataPVC) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opcenter-metadata-pvc-{{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.config.StorageClass }}
  resources:
    requests:
      storage: 5Gi
  volumeName: opcenter-metadata-pv-{{ .Release.Namespace }}
{{ end }}
