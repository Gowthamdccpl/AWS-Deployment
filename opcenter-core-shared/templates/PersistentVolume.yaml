# AWS: PV and PVC at the Shared level (with a file-share-host service)
# Azure: PV and PVC at the Factory level
{{ if eq .Values.cloudProvider "AWSNotInUse" }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: opcenter-metadata-pv
  labels: 
    opcenter-use: metadata
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  accessModes:
    - ReadWriteMany

  storageClassName: opcenter-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: {{ .Values.storage.fileShare }}
{{ end }}
  