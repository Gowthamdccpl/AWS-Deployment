name: Terraform and Helm deploy to AWS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Deployment action"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - redeploy
          - destroy
      # s3_seed_bucket_name:
      #   description: "Optional S3 bucket name to copy files from into FSx before Helm deploy"
      #   required: false
      #   type: string
      s3_seed_prefix:
        description: "Optional S3 prefix/folder to copy into FSx"
        required: false
        type: string
      fsx_share_name:
        description: "FSx SMB share name"
        required: false
        default: share
        type: string
      fsx_seed_subdirectory:
        description: "Optional destination folder inside FSx"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "opcenter-core/**"
      - "opcenter-core-config/**"
      - "opcenter-core-dbupdate/**"
      - "opcenter-core-shared/**"
      - ".github/workflows/deploy-helm-charts-aws.yml"

concurrency:
  group: terraform-helm-main-aws
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_DIR: terraform
  TF_INPUT: "false"
  TF_RESOURCE_NAME: opcenter-dev
  TF_STATE_KEY: opcenter-dev/terraform.tfstate
  SHARED_NAMESPACE: shared
  OPCENTER_NAMESPACE: dev-opcenter
  SHARED_METADATA_PVC: opcenter-metadata-pvc-shared
  OPCENTER_METADATA_PVC: opcenter-metadata-pvc-dev-opcenter
  WINDOWS_NODE_SELECTOR_OS_KEY: kubernetes.io/os
  WINDOWS_NODE_SELECTOR_OS_VALUE: windows
  WINDOWS_NODE_SELECTOR_BUILD_KEY: node.kubernetes.io/windows-build
  WINDOWS_NODE_SELECTOR_BUILD_VALUE: "10.0.20348"

jobs:
  terraform_apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' || github.event.inputs.action == 'redeploy' }}

    outputs:
      eks_cluster_name: ${{ steps.tf_outputs.outputs.eks_cluster_name }}
      rds_endpoint: ${{ steps.tf_outputs.outputs.rds_endpoint }}
      fsx_dns_name: ${{ steps.tf_outputs.outputs.fsx_dns_name }}
      fsx_share_name: ${{ steps.tf_outputs.outputs.fsx_share_name }}
      opcenter_db_secret_name: ${{ steps.tf_outputs.outputs.opcenter_db_secret_name }}
      ad_admin_secret_name: ${{ steps.tf_outputs.outputs.ad_admin_secret_name }}
      datasync_task_arn: ${{ steps.tf_outputs.outputs.datasync_task_arn }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare Terraform remote state
        shell: bash
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state_bucket="opcenter-dev-terraform-state-${account_id}-${AWS_REGION}"

          if ! aws s3api head-bucket --bucket "$state_bucket" 2>/dev/null; then
            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "$state_bucket"
            else
              aws s3api create-bucket \
                --bucket "$state_bucket" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
          fi

          aws s3api put-bucket-versioning \
            --bucket "$state_bucket" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "$state_bucket" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          echo "TF_STATE_BUCKET=$state_bucket" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform format check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Import existing partial resources
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_s3_seed_bucket_name: opcenter-files
          TF_VAR_s3_seed_prefix: ${{ github.event.inputs.s3_seed_prefix || '' }}
          TF_VAR_fsx_share_name: ${{ github.event.inputs.fsx_share_name || 'share' }}
          TF_VAR_fsx_seed_subdirectory: ${{ github.event.inputs.fsx_seed_subdirectory || '' }}
        run: |
          set -euo pipefail

          import_if_missing() {
            local address="$1"
            local id="$2"

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "Terraform state already has $address; skipping import."
              return 0
            fi

            terraform import "$address" "$id"
          }

          rds_secret_arn="$(aws secretsmanager describe-secret --secret-id "${TF_RESOURCE_NAME}/rds/master" --query ARN --output text 2>/dev/null || true)"
          if [[ -n "$rds_secret_arn" && "$rds_secret_arn" != "None" ]]; then
            import_if_missing "aws_secretsmanager_secret.rds" "$rds_secret_arn"
          fi

          ad_secret_arn="$(aws secretsmanager describe-secret --secret-id "${TF_RESOURCE_NAME}/ad/admin" --query ARN --output text 2>/dev/null || true)"
          if [[ -n "$ad_secret_arn" && "$ad_secret_arn" != "None" ]]; then
            import_if_missing "aws_secretsmanager_secret.ad" "$ad_secret_arn"
          fi

          opcenter_db_secret_arn="$(aws secretsmanager describe-secret --secret-id "${TF_RESOURCE_NAME}/opcenter/db" --query ARN --output text 2>/dev/null || true)"
          if [[ -n "$opcenter_db_secret_arn" && "$opcenter_db_secret_arn" != "None" ]]; then
            import_if_missing "aws_secretsmanager_secret.opcenter_db" "$opcenter_db_secret_arn"
          fi

          if aws iam get-role --role-name "${TF_RESOURCE_NAME}-datasync-s3-access" >/dev/null 2>&1; then
            import_if_missing 'aws_iam_role.datasync_s3_access[0]' "${TF_RESOURCE_NAME}-datasync-s3-access"
          fi

          if aws iam get-role-policy --role-name "${TF_RESOURCE_NAME}-datasync-s3-access" --policy-name "${TF_RESOURCE_NAME}-datasync-s3-access" >/dev/null 2>&1; then
            import_if_missing 'aws_iam_role_policy.datasync_s3_access[0]' "${TF_RESOURCE_NAME}-datasync-s3-access:${TF_RESOURCE_NAME}-datasync-s3-access"
          fi

          if aws rds describe-db-subnet-groups --db-subnet-group-name "${TF_RESOURCE_NAME}-db-subnets" >/dev/null 2>&1; then
            import_if_missing "module.rds.aws_db_subnet_group.this" "${TF_RESOURCE_NAME}-db-subnets"
          fi

          if aws kms describe-key --key-id "alias/eks/${TF_RESOURCE_NAME}-eks" >/dev/null 2>&1; then
            import_if_missing 'module.eks.module.kms.aws_kms_alias.this["cluster"]' "alias/eks/${TF_RESOURCE_NAME}-eks"
          fi

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_s3_seed_bucket_name: opcenter-files
          TF_VAR_s3_seed_prefix: ${{ github.event.inputs.s3_seed_prefix || '' }}
          TF_VAR_fsx_share_name: ${{ github.event.inputs.fsx_share_name || 'share' }}
          TF_VAR_fsx_seed_subdirectory: ${{ github.event.inputs.fsx_seed_subdirectory || '' }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Read Terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> "$GITHUB_OUTPUT"
          echo "fsx_dns_name=$(terraform output -raw fsx_dns_name)" >> "$GITHUB_OUTPUT"
          echo "fsx_share_name=$(terraform output -raw fsx_share_name)" >> "$GITHUB_OUTPUT"
          echo "opcenter_db_secret_name=$(terraform output -raw opcenter_db_secret_name)" >> "$GITHUB_OUTPUT"
          echo "ad_admin_secret_name=$(terraform output -raw ad_admin_secret_name)" >> "$GITHUB_OUTPUT"
          echo "datasync_task_arn=$(terraform output -raw datasync_task_arn)" >> "$GITHUB_OUTPUT"

  approve_redeploy:
    name: Manual approval before Helm uninstall
    runs-on: ubuntu-latest
    needs: terraform_apply
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'redeploy' }}
    environment:
      name: production-approval

    steps:
      - name: Approval granted
        run: echo "Approved to uninstall existing Helm releases before redeploy."

  helm_deploy:
    name: Helm deploy
    runs-on: ubuntu-latest
    needs:
      - terraform_apply
      - approve_redeploy
    if: |
      always() &&
      needs.terraform_apply.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event.inputs.action == 'deploy' ||
        needs.approve_redeploy.result == 'success'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Copy S3 seed files to FSx
        if: ${{ needs.terraform_apply.outputs.datasync_task_arn != '' }}
        shell: bash
        env:
          DATASYNC_TASK_ARN: ${{ needs.terraform_apply.outputs.datasync_task_arn }}
        run: |
          set -euo pipefail

          task_execution_arn="$(aws datasync start-task-execution \
            --task-arn "$DATASYNC_TASK_ARN" \
            --query "TaskExecutionArn" \
            --output text)"

          echo "Started DataSync task execution: $task_execution_arn"

          while true; do
            status="$(aws datasync describe-task-execution \
              --task-execution-arn "$task_execution_arn" \
              --query "Status" \
              --output text)"

            echo "DataSync status: $status"

            case "$status" in
              SUCCESS)
                break
                ;;
              ERROR)
                aws datasync describe-task-execution \
                  --task-execution-arn "$task_execution_arn" \
                  --output json
                exit 1
                ;;
              *)
                sleep 30
                ;;
            esac
          done

      - name: Configure EKS Kubernetes access
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ needs.terraform_apply.outputs.eks_cluster_name }}"

      - name: Create Terraform-generated Helm values
        shell: bash
        run: |
          set -euo pipefail

          opcenter_db_json="$(aws secretsmanager get-secret-value \
            --secret-id "${{ needs.terraform_apply.outputs.opcenter_db_secret_name }}" \
            --query SecretString \
            --output text)"

          ad_json="$(aws secretsmanager get-secret-value \
            --secret-id "${{ needs.terraform_apply.outputs.ad_admin_secret_name }}" \
            --query SecretString \
            --output text)"

          opcenter_db_username="$(jq -r '.username' <<< "$opcenter_db_json")"
          opcenter_db_password="$(jq -r '.password' <<< "$opcenter_db_json")"
          opcenter_db_name="$(jq -r '.database' <<< "$opcenter_db_json")"
          fsx_username="$(jq -r '.username' <<< "$ad_json")"
          fsx_password="$(jq -r '.password' <<< "$ad_json")"
          fsx_domain="$(jq -r '.domain' <<< "$ad_json")"

          echo "::add-mask::$opcenter_db_password"
          echo "::add-mask::$fsx_password"

          cat > "$RUNNER_TEMP/terraform-generated-values.yaml" <<EOF
          database:
            host: "${{ needs.terraform_apply.outputs.rds_endpoint }}"
            port: 1433
            username: "$opcenter_db_username"
            password: "$opcenter_db_password"
            schema: "$opcenter_db_name"
            name: "$opcenter_db_name"

          odsDatabase:
            host: "${{ needs.terraform_apply.outputs.rds_endpoint }}"
            port: 1433
            username: "$opcenter_db_username"
            password: "$opcenter_db_password"
            schema: "$opcenter_db_name"
            name: "$opcenter_db_name"

          storage:
            fileShare: "//${{ needs.terraform_apply.outputs.fsx_dns_name }}/${{ needs.terraform_apply.outputs.fsx_share_name }}"

          Fsx:
            createSecret: true
            username: "$fsx_username"
            password: "$fsx_password"
            domain: "$fsx_domain"
          EOF

      - name: Preserve existing metadata PV and PVC
        id: preserve_storage
        shell: bash
        run: |
          set -euo pipefail

          pvc_backup="$RUNNER_TEMP/${OPCENTER_METADATA_PVC}.json"
          pv_backup="$RUNNER_TEMP/${OPCENTER_METADATA_PVC}-pv.json"

          if ! kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE"; then
            echo "Existing PVC $OPCENTER_METADATA_PVC was not found in namespace $OPCENTER_NAMESPACE."
            echo "preserved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pvc_phase="$(kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" -o jsonpath='{.status.phase}')"
          if [[ "$pvc_phase" != "Bound" ]]; then
            echo "Existing PVC $OPCENTER_METADATA_PVC is $pvc_phase, expected Bound."
            exit 1
          fi

          pv_name="$(kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" -o jsonpath='{.spec.volumeName}')"

          kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" -o json \
            | jq 'del(
                .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"],
                .metadata.creationTimestamp,
                .metadata.resourceVersion,
                .metadata.uid,
                .metadata.managedFields,
                .metadata.finalizers,
                .metadata.ownerReferences,
                .status
              )' > "$pvc_backup"

          if [[ -n "$pv_name" ]]; then
            kubectl get pv "$pv_name" -o json \
              | jq 'del(
                  .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"],
                  .metadata.creationTimestamp,
                  .metadata.resourceVersion,
                  .metadata.uid,
                  .metadata.managedFields,
                  .metadata.finalizers,
                  .metadata.ownerReferences,
                  .spec.claimRef,
                  .status
                )' > "$pv_backup"
          fi

          echo "preserved=true" >> "$GITHUB_OUTPUT"
          echo "pv_backup=$pv_backup" >> "$GITHUB_OUTPUT"
          echo "pvc_backup=$pvc_backup" >> "$GITHUB_OUTPUT"

      - name: Uninstall existing releases
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'redeploy' }}
        shell: bash
        run: |
          set -euo pipefail

          release_names=(
            "opcenter-core"
            "opcenter-dbupdate"
            "opcenter-core-dbupdate"
            "dev-opcenter-config"
            "opcenter-core-shared"
            "opcenter-shared"
          )

          namespaces=(
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$SHARED_NAMESPACE"
            "$SHARED_NAMESPACE"
          )

          for i in "${!release_names[@]}"; do
            release_name="${release_names[$i]}"
            namespace="${namespaces[$i]}"

            if helm status "$release_name" -n "$namespace" >/dev/null 2>&1; then
              helm uninstall "$release_name" -n "$namespace" --wait --timeout 10m
            else
              echo "Release $release_name not found in namespace $namespace; skipping uninstall."
            fi
          done

      - name: Restore existing metadata PV and PVC
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'redeploy' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.preserve_storage.outputs.preserved }}" != "true" ]]; then
            echo "No existing metadata PVC was preserved, so the fresh deploy cannot continue."
            exit 1
          fi

          pv_backup="${{ steps.preserve_storage.outputs.pv_backup }}"
          pvc_backup="${{ steps.preserve_storage.outputs.pvc_backup }}"

          if [[ -s "$pv_backup" ]]; then
            kubectl apply -f "$pv_backup"
          fi

          kubectl apply -f "$pvc_backup"

      - name: Deploy shared chart
        shell: bash
        run: |
          set -euo pipefail

          chart_dir="opcenter-core-shared"
          release_name="opcenter-shared"
          namespace="$SHARED_NAMESPACE"
          values_file="$chart_dir/updated-${chart_dir}-values.yaml"

          if [[ ! -f "$values_file" ]]; then
            values_file="$chart_dir/values.yaml"
          fi

          helm lint "$chart_dir" \
            --values "$values_file" \
            --values "$RUNNER_TEMP/terraform-generated-values.yaml"

          helm upgrade --install "$release_name" "$chart_dir" \
            -n "$namespace" \
            --create-namespace \
            --values "$values_file" \
            --values "$RUNNER_TEMP/terraform-generated-values.yaml"

      - name: Deploy application charts
        shell: bash
        run: |
          set -euo pipefail

          chart_dirs=(
            "opcenter-core-config"
            "opcenter-core-dbupdate"
            "opcenter-core"
          )

          release_names=(
            "dev-opcenter-config"
            "opcenter-core-dbupdate"
            "opcenter-core"
          )

          namespaces=(
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
          )

          for i in "${!chart_dirs[@]}"; do
            chart_dir="${chart_dirs[$i]}"
            release_name="${release_names[$i]}"
            namespace="${namespaces[$i]}"
            values_file="$chart_dir/updated-${chart_dir}-values.yaml"
            extra_values_args=(--values "$RUNNER_TEMP/terraform-generated-values.yaml")

            if [[ ! -f "$values_file" ]]; then
              values_file="$chart_dir/values.yaml"
            fi

            if [[ "$chart_dir" == "opcenter-core" ]]; then
              windows_values_file="$RUNNER_TEMP/opcenter-core-aws-windows-node-selectors.yaml"
              cat > "$windows_values_file" <<EOF
          appServer:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          appServerSf:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          portal:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          notificationService:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          securityServices:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          inlinespc:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          EOF
              extra_values_args+=(--values "$windows_values_file")
            fi

            helm lint "$chart_dir" --values "$values_file" "${extra_values_args[@]}"

            helm upgrade --install "$release_name" "$chart_dir" \
              -n "$namespace" \
              --create-namespace \
              --values "$values_file" \
              "${extra_values_args[@]}"
          done

  approve_destroy:
    name: Manual approval before destroy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
    environment:
      name: production-approval

    steps:
      - name: Approval granted
        run: echo "Approved to uninstall Helm releases and destroy Terraform resources."

  destroy:
    name: Helm uninstall and Terraform destroy
    runs-on: ubuntu-latest
    needs: approve_destroy
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare Terraform remote state
        shell: bash
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state_bucket="opcenter-dev-terraform-state-${account_id}-${AWS_REGION}"

          if ! aws s3api head-bucket --bucket "$state_bucket" 2>/dev/null; then
            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "$state_bucket"
            else
              aws s3api create-bucket \
                --bucket "$state_bucket" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
          fi

          aws s3api put-bucket-versioning \
            --bucket "$state_bucket" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "$state_bucket" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          echo "TF_STATE_BUCKET=$state_bucket" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Configure EKS Kubernetes access
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cluster_name="$(terraform output -raw eks_cluster_name)"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$cluster_name"

      - name: Uninstall Helm releases
        shell: bash
        run: |
          set -euo pipefail

          helm uninstall opcenter-core -n "$OPCENTER_NAMESPACE" --wait --timeout 10m || true
          helm uninstall opcenter-core-dbupdate -n "$OPCENTER_NAMESPACE" --wait --timeout 10m || true
          helm uninstall dev-opcenter-config -n "$OPCENTER_NAMESPACE" --wait --timeout 10m || true
          helm uninstall opcenter-shared -n "$SHARED_NAMESPACE" --wait --timeout 10m || true

      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
        run: terraform destroy -auto-approve
