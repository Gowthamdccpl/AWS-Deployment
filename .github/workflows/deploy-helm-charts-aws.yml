name: Fresh deploy Helm charts to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "opcenter-core/**"
      - "opcenter-core-config/**"
      - "opcenter-core-dbupdate/**"
      - "opcenter-core-shared/**"
      - ".github/workflows/deploy-helm-charts-aws.yml"

concurrency:
  group: helm-deploy-main-aws
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  SHARED_NAMESPACE: shared
  OPCENTER_NAMESPACE: dev-opcenter
  OPCENTER_METADATA_PVC: opcenter-metadata-pvc-dev-opcenter
  WINDOWS_NODE_SELECTOR_OS_KEY: kubernetes.io/os
  WINDOWS_NODE_SELECTOR_OS_VALUE: windows
  WINDOWS_NODE_SELECTOR_BUILD_KEY: node.kubernetes.io/windows-build
  WINDOWS_NODE_SELECTOR_BUILD_VALUE: "10.0.20348"
  OPCENTER_DB_PASSWORD: ${{ secrets.OPCENTER_DB_PASSWORD }}

jobs:
  deploy:
    name: Fresh deploy all charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Kubernetes access
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Preserve existing metadata PV and PVC
        id: preserve_storage
        shell: bash
        run: |
          set -euo pipefail

          pvc_backup="$RUNNER_TEMP/${OPCENTER_METADATA_PVC}.json"
          pv_backup="$RUNNER_TEMP/${OPCENTER_METADATA_PVC}-pv.json"

          if ! kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE"; then
            echo "Existing PVC $OPCENTER_METADATA_PVC was not found in namespace $OPCENTER_NAMESPACE."
            echo "This workflow expects the metadata PVC to exist before fresh redeploy."
            echo "preserved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pvc_phase="$(kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" -o jsonpath='{.status.phase}')"
          if [[ "$pvc_phase" != "Bound" ]]; then
            echo "Existing PVC $OPCENTER_METADATA_PVC is $pvc_phase, expected Bound."
            exit 1
          fi

          pv_name="$(kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" -o jsonpath='{.spec.volumeName}')"

          kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" -o json \
            | jq 'del(
                .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"],
                .metadata.creationTimestamp,
                .metadata.resourceVersion,
                .metadata.uid,
                .metadata.managedFields,
                .metadata.finalizers,
                .metadata.ownerReferences,
                .status
              )' > "$pvc_backup"

          if [[ -n "$pv_name" ]]; then
            kubectl get pv "$pv_name" -o json \
              | jq 'del(
                  .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"],
                  .metadata.creationTimestamp,
                  .metadata.resourceVersion,
                  .metadata.uid,
                  .metadata.managedFields,
                  .metadata.finalizers,
                  .metadata.ownerReferences,
                  .spec.claimRef,
                  .status
                )' > "$pv_backup"
          fi

          echo "preserved=true" >> "$GITHUB_OUTPUT"
          echo "pv_name=$pv_name" >> "$GITHUB_OUTPUT"
          echo "pvc_backup=$pvc_backup" >> "$GITHUB_OUTPUT"
          echo "pv_backup=$pv_backup" >> "$GITHUB_OUTPUT"

      - name: Uninstall existing releases
        shell: bash
        run: |
          set -euo pipefail

          release_names=(
            "opcenter-core"
            "opcenter-dbupdate"
            "opcenter-core-dbupdate"
            "dev-opcenter-config"
            "opcenter-core-shared"
            "opcenter-shared"
          )

          namespaces=(
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$SHARED_NAMESPACE"
            "$SHARED_NAMESPACE"
          )

          for i in "${!release_names[@]}"; do
            release_name="${release_names[$i]}"
            namespace="${namespaces[$i]}"

            if helm status "$release_name" -n "$namespace" >/dev/null 2>&1; then
              helm uninstall "$release_name" -n "$namespace" --wait --timeout 10m
            else
              echo "Release $release_name not found in namespace $namespace; skipping uninstall."
            fi
          done

      - name: Restore existing metadata PV and PVC
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.preserve_storage.outputs.preserved }}" != "true" ]]; then
            echo "No existing metadata PVC was preserved, so the fresh deploy cannot continue."
            echo "Restore $OPCENTER_METADATA_PVC in namespace $OPCENTER_NAMESPACE and rerun this workflow."
            exit 1
          fi

          pv_backup="${{ steps.preserve_storage.outputs.pv_backup }}"
          pvc_backup="${{ steps.preserve_storage.outputs.pvc_backup }}"

          if [[ -s "$pv_backup" ]]; then
            kubectl apply -f "$pv_backup"
          fi

          kubectl apply -f "$pvc_backup"

          if ! kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE"; then
            echo "Existing PVC $OPCENTER_METADATA_PVC was not found in namespace $OPCENTER_NAMESPACE."
            echo "Restore this PVC before running the fresh deploy workflow."
            exit 1
          fi

          pvc_phase="$(kubectl get pvc "$OPCENTER_METADATA_PVC" -n "$OPCENTER_NAMESPACE" -o jsonpath='{.status.phase}')"
          if [[ "$pvc_phase" != "Bound" ]]; then
            echo "Existing PVC $OPCENTER_METADATA_PVC is $pvc_phase, expected Bound."
            exit 1
          fi

      - name: Deploy all charts
        shell: bash
        run: |
          set -euo pipefail

          chart_dirs=(
            "opcenter-core-shared"
            "opcenter-core-config"
            "opcenter-core-dbupdate"
            "opcenter-core"
          )

          release_names=(
            "opcenter-shared"
            "dev-opcenter-config"
            "opcenter-core-dbupdate"
            "opcenter-core"
          )

          namespaces=(
            "$SHARED_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
            "$OPCENTER_NAMESPACE"
          )

          for i in "${!chart_dirs[@]}"; do
            chart_dir="${chart_dirs[$i]}"
            release_name="${release_names[$i]}"
            namespace="${namespaces[$i]}"
            values_file="$chart_dir/updated-${chart_dir}-values.yaml"
            extra_values_args=()

            if [[ ! -f "$values_file" ]]; then
              values_file="$chart_dir/values.yaml"
            fi

            if [[ "$chart_dir" == "opcenter-core-config" || "$chart_dir" == "opcenter-core-dbupdate" ]]; then
              if [[ -n "$OPCENTER_DB_PASSWORD" ]]; then
                db_secret_values_file="$RUNNER_TEMP/${chart_dir}-db-secret-values.yaml"
                printf 'database:\n  password: "%s"\n' "$OPCENTER_DB_PASSWORD" > "$db_secret_values_file"
                extra_values_args+=(--values "$db_secret_values_file")
              fi
            fi

            if [[ "$chart_dir" == "opcenter-core" ]]; then
              windows_values_file="$RUNNER_TEMP/opcenter-core-aws-windows-node-selectors.yaml"
              cat > "$windows_values_file" <<EOF
          appServer:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          appServerSf:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          portal:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          notificationService:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          securityServices:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          inlinespc:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          EOF
              extra_values_args+=(--values "$windows_values_file")
            fi

            helm lint "$chart_dir" --values "$values_file" "${extra_values_args[@]}"

            helm upgrade --install "$release_name" "$chart_dir" \
              -n "$namespace" \
              --create-namespace \
              --values "$values_file" \
              "${extra_values_args[@]}"
          done
