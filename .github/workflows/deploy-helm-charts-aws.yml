name: Deploy changed Helm charts to AWS

on:
  push:
    branches:
      - main
    paths:
      - "opcenter-core/**"
      - "opcenter-core-config/**"
      - "opcenter-core-dbupdate/**"
      - "opcenter-core-shared/**"
      - ".github/workflows/deploy-helm-charts-aws.yml"

concurrency:
  group: helm-deploy-main-aws
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  SHARED_NAMESPACE: shared
  OPCENTER_NAMESPACE: dev-opcenter
  WINDOWS_NODE_SELECTOR_OS_KEY: kubernetes.io/os
  WINDOWS_NODE_SELECTOR_OS_VALUE: windows
  WINDOWS_NODE_SELECTOR_BUILD_KEY: node.kubernetes.io/windows-build
  WINDOWS_NODE_SELECTOR_BUILD_VALUE: "10.0.20348"
  OPCENTER_DB_PASSWORD: ${{ secrets.OPCENTER_DB_PASSWORD }}

jobs:
  deploy:
    name: Deploy changed charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Kubernetes access
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Detect changed charts
        id: changed-charts
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          chart_dirs=(
            "opcenter-core-shared"
            "opcenter-core-config"
            "opcenter-core-dbupdate"
            "opcenter-core"
          )

          changed_charts=()
          for chart_dir in "${chart_dirs[@]}"; do
            if grep -qE "^${chart_dir}/" <<< "$changed_files"; then
              changed_charts+=("$chart_dir")
            fi
          done

          {
            echo "charts<<EOF"
            printf "%s\n" "${changed_charts[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy changed charts
        if: steps.changed-charts.outputs.charts != ''
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r chart_dir; do
            [[ -z "$chart_dir" ]] && continue

            release_name="$(awk -F ': *' '$1 == "name" { print $2; exit }' "$chart_dir/Chart.yaml")"
            values_file="$chart_dir/updated-${chart_dir}-values.yaml"
            namespace="$OPCENTER_NAMESPACE"
            extra_values_args=()

            if [[ ! -f "$values_file" ]]; then
              values_file="$chart_dir/values.yaml"
            fi

            if [[ "$chart_dir" == "opcenter-core-shared" ]]; then
              release_name="opcenter-shared"
              namespace="$SHARED_NAMESPACE"
            fi

            if [[ "$chart_dir" == "opcenter-core-config" ]]; then
              release_name="dev-opcenter-config"
            fi

            if [[ "$chart_dir" == "opcenter-core-config" || "$chart_dir" == "opcenter-core-dbupdate" ]]; then
              if [[ -n "$OPCENTER_DB_PASSWORD" ]]; then
                db_secret_values_file="$RUNNER_TEMP/${chart_dir}-db-secret-values.yaml"
                cat > "$db_secret_values_file" <<EOF
          database:
            password: "$OPCENTER_DB_PASSWORD"
          EOF
                extra_values_args+=(--values "$db_secret_values_file")
              fi
            fi

            if [[ "$chart_dir" == "opcenter-core" ]]; then
              windows_values_file="$RUNNER_TEMP/opcenter-core-aws-windows-node-selectors.yaml"
              cat > "$windows_values_file" <<EOF
          appServer:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          appServerSf:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          portal:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          notificationService:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          securityServices:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          inlinespc:
            nodeSelectors:
              "$WINDOWS_NODE_SELECTOR_OS_KEY": "$WINDOWS_NODE_SELECTOR_OS_VALUE"
              "$WINDOWS_NODE_SELECTOR_BUILD_KEY": "$WINDOWS_NODE_SELECTOR_BUILD_VALUE"
          EOF
              extra_values_args+=(--values "$windows_values_file")
            fi

            helm lint "$chart_dir" --values "$values_file"

            helm upgrade --install "$release_name" "$chart_dir" \
              -n "$namespace" \
              --create-namespace \
              --values "$values_file" \
              "${extra_values_args[@]}" \
              --wait \
              --timeout 10m
          done <<< "${{ steps.changed-charts.outputs.charts }}"

      - name: No chart changes
        if: steps.changed-charts.outputs.charts == ''
        run: echo "No Helm chart directory changes detected."
