{{- if .Values.serviceAccount.create -}}
# Copyright Siemens 2022
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opcenter-core-dbupdate.serviceAccountName" . }}
  labels:
    {{- include "opcenter-core-dbupdate.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
