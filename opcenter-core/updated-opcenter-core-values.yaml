nameOverride: ""
fullnameOverride: ""

cloudProvider: AWS
namespace: dev-opcenter

database:
  maxRowsetSize: 15000

defaultDomain: "opcenter.com"

storage:
  fileShare: "//fs-0f9276b41bf18abde.opcenter.com/share"

config:
  StorageClass: opcenter-sc
  secretName: opcfsxsecrets
  metadataPVC: opcenter-metadata-pvc-dev-opcenter

connectMOM:
  enabled: false
  certificatePath: "certificates/connectMOM"
  passphrase: "Passphrase"
  username: ""
  password: ""
  useSSL: true
  serverName: ""
  serverIP: ""
  clientName: ""
  createSecret: true

connectSAPBO:
  serverName: ""
  serverIP: ""
  certificatePath: "certificates/connectSAPBO"
  certPassword: ""
  username: ""
  password: ""

appServer:
  image:
    repository: 641737106879.dkr.ecr.us-east-1.amazonaws.com/opcenter-repo
    tag: app-server-2504.0002
    pullPolicy: Always

  extraEnv:
    - name: OPCORE_AUTHENTICATION_SERVICE_URL
      value: http://security-services/CamstarSecurityServices/AuthenticationService.svc
    - name: OPCORE_AUTHORIZATION_SERVICE_URL
      value: http://security-services/CamstarSecurityServices/AuthorizationService.svc
    - name: OPCORE_SERVICE_ACCOUNT
      value: LocalSystem
  
