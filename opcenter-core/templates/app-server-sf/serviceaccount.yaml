apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-server-sf
  labels:
    {{- include "opcenter-core.labels" . | nindent 4 }}
  {{- with .Values.appServerSf.serviceAccount.annotations }}
  annotations:
