{{- if .Values.appServerSf.enabled -}}
{{- if .Values.appServerSf.ingress.enabled -}}
# Copyright Siemens 2022
{{- $svcPort := .Values.appServerSf.service.port -}}
{{- if and .Values.appServerSf.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.appServerSf.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.appServerSf.ingress.annotations "kubernetes.io/ingress.class" .Values.appServerSf.ingress.className}}
  {{- end }}
{{- end }}
{{ if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{ else -}}
apiVersion: extensions/v1beta1
{{ end}}
kind: Ingress
metadata:
  name: appserversf-ingress
  labels:
    {{- include "opcenter-core.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "{{- .Values.appServerSf.ingress.sslRedirect }}"
    {{- if .Values.appServerSf.ingress.forceAffinity}}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    {{- end}}
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    {{- if .Values.appServerSf.ingress.maxBodySize}}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.appServerSf.ingress.maxBodySize}}
    {{- end}}
    {{- if .Values.appServerSf.ingress.clusterIssuer}}
    cert-manager.io/cluster-issuer: {{ .Values.appServerSf.ingress.clusterIssuer}}
    {{- end}}
  {{- with .Values.appServerSf.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.appServerSf.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.appServerSf.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.appServerSf.ingress.host }}
      http:
        paths:
          - path: /
            {{- if (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: ImplementationSpecific
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: app-server-sf
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: app-server-sf
              servicePort: {{ $svcPort }}
              {{- end }}
  {{- if .Values.appServerSf.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.appServerSf.ingress.host }}
      secretName: opcenter-app-server-sf-tls
  {{- end }}
{{- end }}
{{- end }}