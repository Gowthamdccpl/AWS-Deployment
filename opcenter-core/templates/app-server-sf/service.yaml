{{- if .Values.appServerSf.enabled -}}
# Copyright Siemens 2022
apiVersion: v1
kind: Service
metadata:
  name: app-server-sf
  labels:
    {{- include "opcenter-core.labels" . | nindent 4 }}
spec:
  type: {{ .Values.appServerSf.service.type }}
  ports:
    - port: {{ .Values.appServerSf.service.port }}
  selector:
    {{- include "opcenter-core.appServerSf.selectorLabels" . | nindent 4 }}
{{- end }}