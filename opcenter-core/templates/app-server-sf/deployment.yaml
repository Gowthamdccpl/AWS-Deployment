{{- if .Values.appServerSf.enabled -}}
# Copyright Siemens 2022
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-server-sf
  labels:
    {{- include "opcenter-core.labels" . | nindent 4 }}
spec:
  {{- if not .Values.appServerSf.autoscaling.enabled }}
  replicas: {{ .Values.appServerSf.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 50%
  selector:
    matchLabels:
      {{- include "opcenter-core.appServerSf.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "50505"
        prometheus.io/scheme: http
        prometheus.io/scrape: "true"
        {{- with .Values.appServerSf.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "opcenter-core.appServerSf.selectorLabels" . | nindent 8 }}
        {{- with .Values.appServerSf.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.appServerSf.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: app-server-sf
      securityContext:
        {{- toYaml .Values.appServerSf.podSecurityContext | nindent 8 }}
      containers:
        - name: app-server-sf
          securityContext:
            {{- toYaml .Values.appServerSf.securityContext | nindent 12 }}
          {{- if .Values.appServerSf.connectMOM.enabled }}
          image: "{{ .Values.appServerSf.connectMOM.image.repository }}:{{ .Values.appServerSf.connectMOM.image.tag | default .Chart.AppVersion }}"
          {{- else }}
          image: "{{ .Values.appServerSf.image.repository }}:{{ .Values.appServerSf.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.appServerSf.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: "/CamstarAppServerSf/api"
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: "/CamstarAppServerSf/api"
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          env:
            - name: OPCORE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opcenter-db-secrets
                  key: OPCORE_DB_PASSWORD
            - name: OPCORE_DB_SCHEMA
              valueFrom:
                secretKeyRef:
                  name: opcenter-db-secrets
                  key: OPCORE_DB_SCHEMA
            - name: OPCORE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opcenter-db-secrets
                  key: OPCORE_DB_USERNAME
            {{- if .Values.appServerSf.connectMOM.enabled }}
            {{- if .Values.appServerSf.connectMOM.mountPassphrase }}
            - name: OPCORE_MIO_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: opcenter-db-secrets
                  key: OPCORE_MIO_PASSPHRASE
            {{- end }}
            {{- end }}
            {{- if .Values.appServerSf.connectMOM.enabled }}
            {{- if .Values.appServerSf.connectMOM.mountPassword }}
            - name: OPCORE_MIO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opcenter-db-secrets
                  key: OPCORE_MIO_PASSWORD
            {{- end }}
            {{- end }}
            {{- if .Values.appServerSf.extraEnv -}}
              {{ toYaml .Values.appServerSf.extraEnv | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: opcenter-config
            - configMapRef:
                name: opcenter-deploy-config
            {{- if .Values.appServerSf.extraEnvFrom -}}
              {{ toYaml .Values.appServerSf.extraEnvFrom | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.appServerSf.resources | nindent 12 }}
          volumeMounts:
		      {{- if eq .Values.cloudProvider "Azure" }}
            - name: opcenter-metadata
              mountPath: \opcenter-metadata
          {{- end }}
          {{- if .Values.appServerSf.extraVolumeMounts -}}
            {{ toYaml .Values.appServerSf.extraVolumeMounts | nindent 12 }}
          {{- end }}
      volumes:
      {{- if eq .Values.cloudProvider "Azure" }}
        - name: opcenter-metadata
          persistentVolumeClaim:
            claimName: opcenter-metadata-pvc-{{ .Release.Namespace }}
      {{ end }}
      {{- if .Values.appServerSf.extraVolumes -}}
        {{ toYaml .Values.appServerSf.extraVolumes | nindent 8 }}
      {{- end }}
      nodeSelector:
        "kubernetes.io/os": windows
        "kubernetes.azure.com/os-sku": Windows2022
        {{- with .Values.appServerSf.nodeSelectors }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.appServerSf.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.appServerSf.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}