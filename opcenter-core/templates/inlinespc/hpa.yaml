{{- if .Values.inlinespc.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inlinespc
  labels:
    {{- include "opcenter-core.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inlinespc
  {{- if not .Values.inlinespc.enabled }}
  minReplicas: 0
  {{- else }}
  minReplicas: {{ .Values.inlinespc.autoscaling.minReplicas }}
  {{- end }}
  
  {{- if not .Values.inlinespc.enabled }}
  maxReplicas: 0
  {{- else }}
  maxReplicas: {{ .Values.inlinespc.autoscaling.maxReplicas }}
  {{- end }}

  metrics:
    {{- if .Values.inlinespc.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.inlinespc.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.inlinespc.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.inlinespc.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
